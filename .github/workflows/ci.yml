name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-dev, x64-clang-release]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Clang 22+ for MSVC STL
        if: contains(matrix.preset, 'clang')
        shell: pwsh
        run: |
          function Get-ClangMajor([string]$exe) {
            $out = & $exe --version 2>$null | Select-Object -First 1
            if ($out -match 'version (\d+)\.') { return [int]$Matches[1] }
            return 0
          }
          $major = Get-ClangMajor "clang-cl"
          if ($major -lt 22) {
            $vsLlvm = "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin"
            if ((Test-Path "$vsLlvm\clang-cl.exe") -and (Get-ClangMajor "$vsLlvm\clang-cl.exe") -ge 22) {
              $vsLlvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $major = Get-ClangMajor "$vsLlvm\clang-cl.exe"
            } else {
              choco install llvm --upgrade --no-progress -y
              $major = Get-ClangMajor "C:\Program Files\LLVM\bin\clang-cl.exe"
            }
          }
          if ($major -lt 22) {
            "CLANG_EXTRA_ARGS=-DCMAKE_CXX_FLAGS=/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Configure and build (${{ matrix.preset }})
        shell: cmd
        run: .\build_vs.cmd ${{ matrix.preset }} -DSTRATA_WERROR=ON ${{ env.CLANG_EXTRA_ARGS }}

      - name: Run headless tests
        shell: pwsh
        run: ctest --test-dir build/${{ matrix.preset }} -R "strata_selftest|strata_c_api_test|strata_overlay_modules|strata_bench_smoke" --output-on-failure

      - name: Test Rust bindings (x64-dev)
        if: matrix.preset == 'x64-dev'
        shell: pwsh
        run: |
          $env:STRATA_LIB_DIR = (Resolve-Path "build/x64-dev/lib").Path
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo test --manifest-path bindings/rust/Cargo.toml

  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake fonts-dejavu-core

      - name: Configure and build headless library & C API test (PCH off)
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_BUILD_OPENGL=ON \
            -DSTRATA_BUILD_VULKAN=OFF \
            -DSTRATA_BUILD_TESTS=ON \
            -DSTRATA_PCH=OFF \
            -DSTRATA_WERROR=ON
          cmake --build build/linux
          ctest --test-dir build/linux --output-on-failure

      - name: Verify install & find_package consumer
        run: |
          cmake --install build/linux --prefix "$PWD/build/install"
          mkdir -p build/consumer
          cat > build/consumer/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(strata_consumer LANGUAGES CXX)
          find_package(strata CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE strata::strata)
          EOF
          cat > build/consumer/main.cpp << 'EOF'
          #include <strata/strata.hpp>
          int main() {
              auto ui = strata::context::create();
              return ui ? 0 : 1;
          }
          EOF
          cmake -S build/consumer -B build/consumer/out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer/out
          ./build/consumer/out/consumer

      - name: Test Rust bindings
        run: |
          STRATA_LIB_DIR="$PWD/build/linux/lib" cargo test --manifest-path bindings/rust/Cargo.toml

  macos-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: brew install ninja

      - name: Configure and build Metal backend
        run: |
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_MINIMAL=ON \
            -DSTRATA_BUILD_METAL=ON \
            -DSTRATA_PCH=OFF \
            -DSTRATA_WERROR=ON
          cmake --build build/macos

  wasm-webgpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools & fonts
        run: sudo apt-get update && sudo apt-get install -y ninja-build fonts-dejavu-core

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure and build WebGPU browser sandbox
        run: |
          emcmake cmake --preset wasm-release -DSTRATA_WERROR=ON
          cmake --build build/wasm-release
